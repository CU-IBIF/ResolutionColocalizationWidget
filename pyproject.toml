[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "colocwidget"
version = "0.1.0"
description = "An interactive model of how resolution, distribution and compartments shape colocalization coefficients"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# Upper bound, not caution: PySide6 6.12.0 over-decrefs None in setPen and aborts
# the interpreter ("Fatal Python error: none_dealloc") on Python < 3.12 -- see
# NoiseWidget and MicroscopeWidget, which hit it in CI. Lift once a release fixes it.
ui = ["PySide6>=6.6,!=6.12.0"]
dev = ["pytest>=8.0", "pyyaml>=6.0"]

[project.scripts]
colocwidget = "colocwidget.__main__:main"

[tool.setuptools.packages.find]
include = ["colocwidget*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
